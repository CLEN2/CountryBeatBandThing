<!DOCTYPE html>
<html lang="en">
<head>

            background: linear-gradient(135deg, #1e1e2f, #11111d);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        p {
            margin-bottom: 15px;
            color: #aaa;
            font-size: 1.1rem;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
            max-width: 1200px;
        }

        .tab-btn {
            background-color: #2a2a40;
            color: #ccc;
            border: 1px solid #444466;
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #3b3b5c;
            color: #fff;
        }

        .tab-btn.active {
            background-color: #ff0055;
            color: #fff;
            border-color: #ff0055;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
        }

        .btn {
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .create-btn {
            background-color: #7000ff;
            box-shadow: 0 4px 12px rgba(112, 0, 255, 0.4);
        }
        .create-btn:hover {
            transform: scale(1.05);
            background-color: #8822ff;
        }

        .song-btn {
            background-color: #00e5ff;
            color: #111;
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.4);
        }

        .song-btn:hover {
            transform: scale(1.05);
            background-color: #33ebff;
        }

        .song-btn.playing {
            background-color: #ffbe0b;
            color: #111;
            box-shadow: 0 4px 12px rgba(255, 190, 11, 0.5);
        }

        .stop-btn {
            background-color: #ff3366;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.4);
        }

        .stop-btn:hover {
            transform: scale(1.05);
            background-color: #ff0044;
        }

        .flag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1400px;
            padding: 10px;
        }

        .flag-card {
            background-color: #2a2a40;
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            user-select: none;
            border: 2px solid transparent;
            position: relative;
        }

        .flag-card:hover {
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
        }

        .flag-card.active {
            box-shadow: 0 0 25px var(--glow-color, #ff0055);
            border: 2px solid var(--glow-color, #ff0055);
            background-color: #353554;
        }

        .delete-card-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .delete-card-btn:hover {
            background: #ff0033;
            transform: scale(1.15);
        }

        .flag-wrapper {
            position: relative;
            width: 90px;
            height: 60px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .flag-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            will-change: transform;
            display: block;
            border-radius: 2px;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5));
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            animation-direction: alternate;
            backface-visibility: hidden;
        }

        .country-name {
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .instrument-tag {
            font-size: 0.7rem;
            color: #8888aa;
            margin-top: 4px;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: #8888aa;
            font-size: 1.2rem;
            padding: 40px;
        }

        /* --- MODAL STUDIO --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: #232338;
            border: 2px solid #555588;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(112, 0, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-card h2 {
            margin: 0;
            text-align: center;
            color: #00e5ff;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: #ccc;
            font-weight: 600;
        }

        .form-group input[type="text"], .form-group select {
            background: #151525;
            border: 1px solid #444466;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        canvas#flagCanvas {
            background: #ffffff;
            border-radius: 8px;
            cursor: crosshair;
            border: 2px solid #444466;
            touch-action: none;
            width: 100%;
            max-width: 300px;
            height: 200px;
            margin: 0 auto;
            display: block;
        }

        .canvas-tools {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .btn-small {
            background: #444466;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-small:hover {
            background: #666699;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        /* --- BASE ANIMATION KEYFRAMES --- */
        @keyframes animSpinFast { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes animGoCrazy { 0% { transform: translate(0, 0) rotate(0deg) scale(1); } 20% { transform: translate(-8px, 6px) rotate(-15deg) scale(1.2); } 40% { transform: translate(8px, -6px) rotate(15deg) scale(0.9); } 60% { transform: translate(-6px, -8px) rotate(-20deg) scale(1.1); } 80% { transform: translate(6px, 8px) rotate(20deg) scale(0.95); } 100% { transform: translate(0, 0) rotate(0deg) scale(1); } }
        @keyframes anim3DFlip { 0% { transform: rotateY(0deg) rotateX(0deg); } 50% { transform: rotateY(180deg) rotateX(20deg) scale(1.15); } 100% { transform: rotateY(360deg) rotateX(0deg); } }
        @keyframes animElasticBounce { 0% { transform: scale(1, 1); } 30% { transform: scale(1.35, 0.75); } 50% { transform: scale(0.75, 1.35); } 70% { transform: scale(1.15, 0.85); } 100% { transform: scale(1, 1); } }
        @keyframes animSuperWave { 0% { transform: rotate(-25deg) skewX(-15deg); } 100% { transform: rotate(25deg) skewX(15deg); } }
        @keyframes animHyperPulse { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.25); filter: brightness(1.6); } }
        @keyframes animBarrelRoll { 0% { transform: rotateZ(0deg) translateY(0); } 50% { transform: rotateZ(180deg) translateY(-8px); } 100% { transform: rotateZ(360deg) translateY(0); } }
        @keyframes animZigZag { 0% { transform: translateX(-8px) skewY(-5deg); } 100% { transform: translateX(8px) skewY(5deg); } }
        @keyframes animJellyWiggle { 0% { transform: skewX(-12deg) skewY(4deg) scale(1); } 50% { transform: skewX(12deg) skewY(-4deg) scale(1.1); } 100% { transform: skewX(-12deg) skewY(4deg) scale(1); } }
        @keyframes animOrbitTilt { 0% { transform: rotate(-10deg) translateY(-5px) scale(0.95); } 50% { transform: rotate(10deg) translateY(5px) scale(1.15); } 100% { transform: rotate(-10deg) translateY(-5px) scale(0.95); } }

        @keyframes animCustomCubeSpin {
            0% { transform: perspective(400deg) rotateY(0deg) rotateZ(0deg) scale(1); }
            50% { transform: perspective(400deg) rotateY(180deg) rotateZ(15deg) scale(1.3); }
            100% { transform: perspective(400deg) rotateY(360deg) rotateZ(0deg) scale(1); }
        }
        @keyframes animCustomWarpStretch {
            0% { transform: scale(1, 1) rotate(0deg); }
            25% { transform: scale(1.8, 0.4) rotate(-10deg); }
            50% { transform: scale(0.4, 1.8) rotate(10deg); }
            75% { transform: scale(1.4, 0.6) rotate(-5deg); }
            100% { transform: scale(1, 1) rotate(0deg); }
        }
        @keyframes animCustomPulseGlow {
            0% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 2px #ff00ea); }
            50% { transform: scale(1.35) translateY(-10px); filter: drop-shadow(0 0 18px #00ffff); }
            100% { transform: scale(1) translateY(0); filter: drop-shadow(0 0 2px #ff00ea); }
        }
        @keyframes animCustomBounceCascade {
            0% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-18px) rotate(-12deg) scale(1.1); }
            60% { transform: translateY(6px) rotate(12deg) scale(0.95); }
            80% { transform: translateY(-8px) rotate(-5deg) scale(1.05); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes animCustomOrbitalWobble {
            0% { transform: rotate(0deg) translateX(0px) rotate(0deg); }
            25% { transform: rotate(90deg) translateX(10px) rotate(-90deg) scale(1.2); }
            50% { transform: rotate(180deg) translateX(0px) rotate(-180deg) scale(0.85); }
            75% { transform: rotate(270deg) translateX(-10px) rotate(-270deg) scale(1.2); }
            100% { transform: rotate(360deg) translateX(0px) rotate(-360deg) scale(1); }
        }
    </style>
</head>

        <button class="btn create-btn" onclick="openModal()">➕ Create Custom Country</button>
        <button class="btn song-btn" id="autoSongBtn" onclick="toggleAutoSong()">✨ Random Auto Jam</button>
        <button class="btn stop-btn" onclick="stopAllBeats()">⏹️ Stop All Beats</button>
    </div>

    <div class="tabs" id="tabContainer"></div>

    <div class="flag-grid" id="flagGrid"></div>

    <!-- MODAL CREATOR -->
    <div class="modal-overlay" id="creatorModal">

            <h2>🎨 Country Creator Studio</h2>
            
            <div class="form-group">
                <label>Country Name:</label>
                <input type="text" id="newCountryName" placeholder="e.g. Pixelia" value="My Country">
            </div>

            <div class="form-group">
                <label>Draw Flag Canvas:</label>
                <canvas id="flagCanvas" width="300" height="200"></canvas>
                <div class="canvas-tools">
                    <input type="color" id="brushColor" value="#ff0055">
                    <label style="font-size:0.8rem;">Size:</label>
                    <input type="range" id="brushSize" min="3" max="30" value="12">
                    <button class="btn-small" onclick="clearCanvas()">🗑️ Clear</button>
                </div>
            </div>

            <div class="form-group">
                <label>Select Sound Beat (200+ Sounds Available):</label>
                <select id="soundSelect"></select>
            </div>

            <div class="form-group">
                <label>Select Flag Animation (200+ Animations Available):</label>
                <select id="animSelect"></select>
            </div>

            <div class="modal-actions">
                <button class="btn-small" style="background:#ff3366;" onclick="closeModal()">Cancel</button>
                <button class="btn-small" style="background:#00e5ff; color:#111; font-weight:bold;" onclick="saveCustomCountry()">🚀 Save Country</button>
            </div>
        </div>
    </div>

        /* --- GENERATE 200+ SOUNDS & ANIMATIONS IN MODAL --- */
        function populateStudioSelectors() {
            const soundSelect = document.getElementById('soundSelect');
            const animSelect = document.getElementById('animSelect');
            soundSelect.innerHTML = '';
            animSelect.innerHTML = '';

            const soundCategories = [
                { type: 'cosmicSynth', name: 'Cosmic Synth' },
                { type: 'laserBass', name: 'Laser Bass' },

                { type: 'bass', name: 'Groove Bass' },
                { type: 'chime', name: 'Bright Chime' }
            ];

            let soundCount = 0;
            soundCategories.forEach(cat => {
                for (let octave = 1; octave <= 25; octave++) {
                    soundCount++;
                    const freq = Math.round(50 * Math.pow(1.15, octave));
                    const option = document.createElement('option');
                    option.value = `${cat.type}|${freq}|${cat.name} #${octave}`;
                    option.innerText = `🎵 ${cat.name} (Pitch Tier #${octave} - ${freq}Hz)`;

        function playSoundCustom(type, freq, duration = 0.3) {
            initAudio();
            const now = audioCtx.currentTime;

            if (type === 'cosmicSynth') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 2.5, now + duration);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } else if (type === 'laserBass') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq * 3, now);
                osc.frequency.exponentialRampToValueAtTime(freq, now + 0.1);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } else if (type === 'glitchPerc') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.setValueAtTime(freq / 2, now + 0.05);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'crystalBell') {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 2.75, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration * 2);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration * 2);
                osc2.stop(now + duration * 2);
            } else if (type === 'subDrop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === 'synth') {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc1.type = 'sawtooth';
                osc2.type = 'square';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 1.005, now);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(freq * 4, now);
                filter.frequency.exponentialRampToValueAtTime(freq, now + duration);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration);
                osc2.stop(now + duration);
            } else if (type === 'bass') {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(freq * 3, now);
                filter.frequency.exponentialRampToValueAtTime(freq, now + duration);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration);
            } else if (type === 'chime') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration * 1.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration * 1.5);
            } else if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'snare') {
                const noise = audioCtx.createBufferSource();
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1800;
                filter.Q.value = 1;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (type === 'clap') {
                const noise = audioCtx.createBufferSource();
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.25, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1200;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.setValueAtTime(0.1, now + 0.015);
                gain.gain.setValueAtTime(0.5, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (type === 'hihat') {
                const noise = audioCtx.createBufferSource();
                const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 7000;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            }
        }

        const glowColors = ['#ff0055', '#00e5ff', '#ffbe0b', '#00ff66', '#ff00ff', '#7000ff'];

        function registerCountryAnim(index, animOverride) {
            const country = countries[index];
            
            if (animOverride) {
                const parts = animOverride.split('|');
                flagAnimProfiles[index] = {
                    name: parts[0],
                    speed: parts[1] || '0.3s',
                    delay: '0s',
                    direction: parts[2] || 'alternate'
                };
            } else {
                const animName = realCountryAnimations[index % realCountryAnimations.length];
                const animSpeed = (0.28 + ((index * 7) % 55) / 100).toFixed(2);
                const animDelay = ((index * 3) % 40 / 100).toFixed(2);
                const directions = ['alternate', 'normal', 'reverse', 'alternate-reverse'];
                const animDir = directions[index % directions.length];

                flagAnimProfiles[index] = {
                    name: animName,
                    speed: `${animSpeed}s`,
                    delay: `${animDelay}s`,
                    direction: animDir
                };
            }
        }

        countries.forEach((_, i) => registerCountryAnim(i));

        function setupTabs() {
            const tabContainer = document.getElementById('tabContainer');
            tabContainer.innerHTML = '';

            regions.forEach(reg => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${reg.id === currentRegion ? 'active' : ''}`;
                btn.innerText = reg.label;
                btn.onclick = () => {
                    currentRegion = reg.id;
                    setupTabs();
                    renderGrid();
                };
                tabContainer.appendChild(btn);
            });
        }

        function renderGrid() {
            const grid = document.getElementById('flagGrid');
            grid.innerHTML = '';

            const filtered = countries.filter(c => currentRegion === 'all' || c.region === currentRegion);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-msg">✨ "Your Countries" is currently empty! Click <b>"➕ Create Custom Country"</b> above to draw your own flag!</div>`;
                return;
            }

            countries.forEach((country, index) => {
                if (currentRegion !== 'all' && country.region !== currentRegion) return;

                const card = document.createElement('div');
                card.className = `flag-card ${activeLoops.has(index) ? 'active' : ''}`;

                const glowColor = glowColors[index % glowColors.length];
                card.style.setProperty('--glow-color', glowColor);

                const flagUrl = country.customSrc ? country.customSrc : `https://flagcdn.com/w160/${country.code}.png`;

                let deleteBtnHtml = '';
                if (country.region === 'your_countries') {
                    deleteBtnHtml = `<button class="delete-card-btn" title="Delete Country" onclick="deleteCustomCountry(event, ${index})">✕</button>`;
                }

                card.innerHTML = `
                    ${deleteBtnHtml}
                    <div class="flag-wrapper">
                        <img class="flag-img" id="flag-img-${index}" src="${flagUrl}" alt="${country.name} Flag" loading="lazy">
                    </div>
                    <div class="country-name">${country.name}</div>
                    <div class="instrument-tag">🎵 ${country.tag}</div>
                `;

                if (activeLoops.has(index)) {
                    setTimeout(() => applyUniqueAnimation(index), 0);
                }

                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-card-btn')) return;
                    toggleFlagBeat(index);
                });

                grid.appendChild(card);
            });
        }

        function deleteCustomCountry(event, index) {
            event.stopPropagation();
            if (activeLoops.has(index)) {
                clearInterval(activeLoops.get(index));
                activeLoops.delete(index);
            }
            countries.splice(index, 1);
            flagAnimProfiles.splice(index, 1);
            
            // Re-index remaining profiles
            flagAnimProfiles.length = 0;
            countries.forEach((c, idx) => {
                registerCountryAnim(idx, c.animValString);
            });

            renderGrid();
        }

        function applyUniqueAnimation(index) {
            const img = document.getElementById(`flag-img-${index}`);
            if (!img) return;
            const profile = flagAnimProfiles[index];

            img.style.animationName = profile.name;
            img.style.animationDuration = profile.speed;
            img.style.animationDelay = profile.delay;
            img.style.animationDirection = profile.direction;
        }

        function toggleFlagBeat(index) {
            initAudio();
            const country = countries[index];

            if (activeLoops.has(index)) {
                clearInterval(activeLoops.get(index));
                activeLoops.delete(index);
                renderGrid();
            } else {
                playSoundCustom(country.type, country.note);
                
                let intervalTime = 500;
                if (country.type === 'kick' || country.type === 'subDrop') intervalTime = 500;
                else if (country.type === 'snare' || country.type === 'clap') intervalTime = 1000;
                else if (country.type === 'hihat' || country.type === 'glitchPerc') intervalTime = 250;
                else intervalTime = 500;

                const intervalId = setInterval(() => {
                    playSoundCustom(country.type, country.note);
                }, intervalTime);

                activeLoops.set(index, intervalId);
                renderGrid();
            }
        }

        function stopAllBeats() {
            activeLoops.forEach((intervalId) => clearInterval(intervalId));
            activeLoops.clear();

            if (autoJamInterval) {
                clearInterval(autoJamInterval);
                autoJamInterval = null;
                document.getElementById('autoSongBtn').classList.remove('playing');
                document.getElementById('autoSongBtn').innerHTML = '✨ Random Auto Jam';
            }

            renderGrid();
        }

        function toggleAutoSong() {
            initAudio();
            const btn = document.getElementById('autoSongBtn');

            if (autoJamInterval) {
                stopAllBeats();
            } else {
                stopAllBeats();
                btn.classList.add('playing');
                btn.innerHTML = '⏸️ Stop Auto Jam';

                const kicks = countries.filter(c => c.type === 'kick' || c.type === 'subDrop');
                const snares = countries.filter(c => c.type === 'snare' || c.type === 'clap');
                const hihats = countries.filter(c => c.type === 'hihat' || c.type === 'glitchPerc');
                const synths = countries.filter(c => c.type === 'synth' || c.type === 'chime' || c.type === 'cosmicSynth' || c.type === 'crystalBell');

                const randomKick = countries.indexOf(kicks[Math.floor(Math.random() * kicks.length)]);
                const randomSnare = countries.indexOf(snares[Math.floor(Math.random() * snares.length)]);
                const randomHiHat = countries.indexOf(hihats[Math.floor(Math.random() * hihats.length)]);
                const randomSynth = countries.indexOf(synths[Math.floor(Math.random() * synths.length)]);

                toggleFlagBeat(randomKick);
                setTimeout(() => toggleFlagBeat(randomSnare), 250);
                setTimeout(() => toggleFlagBeat(randomHiHat), 125);
                setTimeout(() => toggleFlagBeat(randomSynth), 500);

                autoJamInterval = setInterval(() => {
                    const nextSynth = countries.indexOf(synths[Math.floor(Math.random() * synths.length)]);
                    playSoundCustom(countries[nextSynth].type, countries[nextSynth].note);
                }, 500);
            }
        }

        /* --- FIXED ACCURATE DRAWING CANVAS LOGIC --- */
        const canvas = document.getElementById('flagCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        clearCanvas();

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCanvasCoords(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const coords = getCanvasCoords(e);

            ctx.lineWidth = document.getElementById('brushSize').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = document.getElementById('brushColor').value;

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', draw, { passive: false });

        function openModal() {
            document.getElementById('creatorModal').classList.add('open');
            setTimeout(clearCanvas, 50);
        }

        function closeModal() {
            document.getElementById('creatorModal').classList.remove('open');
        }

        function saveCustomCountry() {
            const name = document.getElementById('newCountryName').value.trim() || "My Country";
            const soundVal = document.getElementById('soundSelect').value.split('|');
            const animVal = document.getElementById('animSelect').value;

            const flagDataUrl = canvas.toDataURL("image/png");

            const newCountry = {
                name: name,
                code: 'custom_' + Date.now(),
                region: 'your_countries',
                customSrc: flagDataUrl,
                type: soundVal[0],
                note: parseFloat(soundVal[1]),
                tag: soundVal[2],
                animValString: animVal
            };

            countries.push(newCountry);
            const newIndex = countries.length - 1;
            registerCountryAnim(newIndex, animVal);

            closeModal();
            clearCanvas();

            currentRegion = 'your_countries';
            setupTabs();
            renderGrid();
        }

        // Initial setup
        populateStudioSelectors();
        setupTabs();
        renderGrid();
    </script>
</body>
